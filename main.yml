name: LMS VAA Auto Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải code về server
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: 📦 Khởi tạo và cài đặt thư viện
        run: |
          npm init -y
          npm install puppeteer axios

      - name: 🛠️ Tải trình duyệt cho Puppeteer
        run: npx puppeteer browsers install chrome

      - name: 🚀 Chạy Bot
        # CHÚ Ý DÒNG NÀY: Đã đổi tên file thành bot-lms
        run: node bot-lms.js
        env:
          # Vào GitHub repo → Settings → Secrets and variables → Actions → New repository secret
          # Thêm 3 secret sau đây:
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}     # MSSV của bạn
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}     # Mật khẩu LMS của bạn
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # URL Webhook Discord của bạn
